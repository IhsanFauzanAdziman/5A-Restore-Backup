# Konfigurasi Standar - Project 5A: Sistem Otomasi Backup dan Pemulihan Data Linux
# Kelompok 1, Kelas A (Ubuntu Server 26.04 LTS)
# Salin berkas ini menjadi config/backup.conf sebelum menjalankan sistem

# 1. Direktori Kerja Utama (validasi.sh, buat_arsip.sh, restore.sh, backup.sh)
SOURCE_DIR="./dataSumber"
BACKUP_DIR="./dataBackup"
RESTORE_DIR="./restore_test"
TEST_DIR="./tests"

# 2. Format Penamaan Arsip & Checksum (buat_arsip.sh & verifikasi.sh)
# Menghasilkan format: backup_YYYYMMDD_HHMMSS.tar.gz dan .tar.gz.sha256
ARCHIVE_PREFIX="backup"
ARCHIVE_EXT=".tar.gz"
CHECKSUM_ALGO="sha256"

# 3. Pengaturan Lock Proses Paralel (backup.sh)
LOCK_FILE="/tmp/backup.lock"
BACKUP_DELAY=0

# 4. Pengaturan Log & Laporan Operasional (backup.sh, restore.sh, verifikasi.sh)
LOG_DIR="./logs"
LOG_FILE="./logs/backup.log"
RESTORE_LOG="./logs/restore.log"
VERIFIKASI_LOG="./verifikasi.log"
REPORT_DIR="./reports"
REPORT_LATEST="./reports/laporan_terbaru.txt"

# 5. Standar Hak Akses / Permission Linux (Tabel 2.4 & Bab IV)
DIR_PERMISSION="750"
ARCHIVE_PERMISSION="640"
LOG_PERMISSION="640"
REPORT_PERMISSION="600"

# 6. Konfigurasi Audit Read-Only Docker (Bab IV 4.8)
DOCKER_IMAGE="alpine:latest"
DOCKER_MOUNT_TARGET="/data"
DOCKER_MOUNT_MODE="ro"
